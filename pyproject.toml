[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "git-trail-tui"
version = "0.6.1"
description = "Browse the Git history of a line, paragraph, function, or class."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "textual==8.2.8",
  "tree-sitter==0.25.2",
  "tree-sitter-language-pack==0.10.0",
]

[project.scripts]
git-trail = "git_trail.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["git_trail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
